# Empresas para candidatura espontânea (1 e-mail por empresa).
#
# O sistema visita o site OFICIAL de cada uma e procura o e-mail de
# recrutamento ("Trabalhe conosco", "Carreiras", rodapé). Nenhum e-mail aqui é
# inventado: se o site não publicar, a empresa fica em "Sem e-mail" com o link
# do portal de carreiras e o seu PDF pronto para anexar lá.
#
# Big techs (Google, Microsoft, Amazon...) NÃO recebem currículo por e-mail —
# só pelo portal. Elas estão aqui para você não esquecer delas.
#
# Para adicionar as suas, crie config/empresas.yaml no mesmo formato (ou use a
# tela "Empresas"). Se souber o e-mail de RH, informe em `email:`.

