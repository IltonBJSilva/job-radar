{% extends "base.html" %}
{% block titulo %}Descobrir vagas — Job Radar{% endblock %}
{% block head %}
<style>
  .topo { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  .topo .sp { flex: 1; }
  .palco { position: relative; max-width: 620px; margin: 0 auto; min-height: min(560px, calc(100dvh - 290px)); }
  @media (max-width: 600px) {
    main { padding-top: 12px; }
    .topo { margin-bottom: 10px; }
    .palco { min-height: calc(100dvh - 300px); }
    .redondo { width: 58px; height: 58px; }
    .acoes { position: sticky; bottom: 8px; margin-top: 10px; }
    .dica { display: none; }
  }
  .vaga { position: absolute; inset: 0; padding: 22px 24px; display: flex; flex-direction: column; touch-action: pan-y; user-select: none; transition: transform .28s ease, opacity .28s ease; }
  .vaga.atras { transform: scale(.96) translateY(14px); opacity: .55; pointer-events: none; }
  .vaga h2 { margin: 6px 0 2px; font-size: 22px; line-height: 1.25; }
  .vaga .emp { font-weight: 700; color: var(--muted); }
  .meta { display: flex; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin: 8px 0 10px; }
  .score { display: flex; align-items: center; gap: 10px; margin: 6px 0 8px; }
  .barra { flex: 1; height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .barra i { display: block; height: 100%; border-radius: 99px; }
  .desc { flex: 1; overflow: auto; white-space: pre-line; font-size: 13.5px; color: var(--muted); border-top: 1px solid var(--line); margin-top: 10px; padding-top: 10px; }
  .selo { position: absolute; top: 26px; font-size: 26px; font-weight: 900; padding: 4px 14px; border: 4px solid; border-radius: 10px; opacity: 0; transform: rotate(-12deg); }
  .selo.sim { right: 24px; color: var(--ok); } .selo.nao { left: 24px; color: var(--no); transform: rotate(12deg); }
  .acoes { display: flex; justify-content: center; gap: 22px; margin-top: 18px; }
  .redondo { width: 68px; height: 68px; border-radius: 50%; font-size: 28px; border: 0; cursor: pointer; background: var(--card); box-shadow: var(--shadow); }
  .redondo.no { color: var(--no); } .redondo.ok { color: var(--ok); } .redondo.undo { width: 52px; height: 52px; font-size: 20px; color: var(--warn); align-self: center; }
  .vazio { text-align: center; padding: 70px 20px; }
  .email-tag { font-size: 12.5px; font-weight: 700; color: var(--ok); }
  .dica { text-align: center; font-size: 12.5px; color: var(--muted); margin-top: 10px; }
  .filtros { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; padding: 12px 14px; margin: -4px 0 16px; }
  .filtros .campo { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--muted); font-weight: 600; }
  .filtros select, .filtros input[type=text] { padding: 7px 9px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; font-size: 13.5px; min-width: 120px; }
  .filtros input[type=text] { width: 190px; }
  .toggles { display: flex; gap: 6px; }
  .toggles label { margin: 0; display: flex; align-items: center; gap: 5px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 99px; cursor: pointer; font-size: 13px; color: var(--ink); font-weight: 500; }
  .toggles input { width: auto; margin: 0; }
  .toggles label:has(input:checked) { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); }
  .filtros .resumo { margin-left: auto; font-size: 13.5px; color: var(--ink); display: flex; gap: 10px; align-items: center; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .tag { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--line); color: var(--ink); }
  @media (max-width: 600px) {
    .filtros { padding: 10px; gap: 8px; }
    .filtros .campo { flex: 1 1 45%; }
    .filtros select, .filtros input[type=text] { width: 100%; min-width: 0; }
    .filtros .resumo { margin-left: 0; width: 100%; justify-content: space-between; }
  }
</style>
{% endblock %}
{% block corpo %}
<div class="topo">
  <button class="btn primary" data-trava onclick="importar()">🔄 Buscar vagas novas</button>
  <button class="btn" data-trava onclick="enriquecer()" title="Baixa a descrição completa das melhores vagas para achar e-mail">✉️ Procurar e-mails</button>
  <span class="sp"></span>
  <button class="btn" id="btnFiltros" onclick="alternarFiltros()" aria-expanded="true" aria-controls="filtros">⚙️ Filtros</button>
</div>

<div class="card filtros" id="filtros" role="search" aria-label="Filtros de vagas">
  <div class="campo"><label for="fPais" style="margin:0">País</label>
    <select id="fPais"><option value="">Todos</option><option value="brasil">🇧🇷 Brasil</option><option value="exterior">🌎 Exterior</option></select></div>
  <div class="campo"><label for="fIdioma" style="margin:0">Idioma da vaga</label>
    <select id="fIdioma"><option value="">Todos</option><option value="pt">Português</option><option value="en">Inglês</option><option value="es">Espanhol</option></select></div>
  <div class="campo"><span>Modalidade</span>
    <div class="toggles">
      <label><input type="checkbox" name="fMod" value="remoto"> Remoto</label>
      <label><input type="checkbox" name="fMod" value="hibrido"> Híbrido</label>
      <label><input type="checkbox" name="fMod" value="presencial"> Presencial</label>
    </div></div>
  <div class="campo"><label for="fRegiao" style="margin:0">Região (Brasil)</label>
    <select id="fRegiao"><option value="">Todas</option><option value="Norte">Norte</option><option value="Nordeste">Nordeste</option><option value="Centro-Oeste">Centro-Oeste</option><option value="Sudeste">Sudeste</option><option value="Sul">Sul</option></select></div>
  <div class="campo"><label for="fLocal" style="margin:0">Localização</label>
    <input type="text" id="fLocal" list="sugLocal" placeholder="cidade, UF ou país (ex.: udia, BH, Espanha)" autocomplete="off">
    <datalist id="sugLocal"></datalist>
    <span id="entendi" style="font-weight:500;font-size:12px;min-height:15px"></span></div>
  <div class="campo"><span>&nbsp;</span>
    <div class="toggles"><label><input type="checkbox" id="soEmail"> só com e-mail</label></div></div>
  <div class="resumo"><span id="totalFiltro" aria-live="polite"></span><button class="btn" type="button" onclick="limparFiltros()">Limpar</button></div>
</div>

<div class="palco" id="palco"></div>
<div class="acoes" id="acoes">
  <button class="redondo no" title="Descartar (←)" aria-label="Descartar vaga" onclick="decidir('descartar')">✕</button>
  <button class="redondo undo" title="Desfazer (Backspace)" aria-label="Desfazer última decisão" onclick="desfazer()">↺</button>
  <button class="redondo ok" title="Quero! (→)" aria-label="Quero esta vaga" onclick="decidir('curtir')">♥</button>
</div>
<div class="dica" id="dica">← descartar · → quero (gera CV + carta adaptados) · arraste o cartão no celular</div>
{% endblock %}
{% block scripts %}
<script>
let fila = [], historico = [];
const esc = s => (s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const cor = s => s >= 70 ? 'var(--ok)' : s >= 45 ? 'var(--warn)' : 'var(--no)';

const CHAVE_FILTROS = 'jobradar.filtros';
const ROTULO = { pais: { brasil: '🇧🇷 Brasil', exterior: '🌎 Exterior' }, idioma: { pt: 'PT', en: 'EN', es: 'ES' },
                 modalidade: { remoto: 'Remoto', hibrido: 'Híbrido', presencial: 'Presencial' } };

function lerFiltros() {
  return {
    pais: document.getElementById('fPais').value, idioma: document.getElementById('fIdioma').value,
    modalidade: [...document.querySelectorAll('input[name=fMod]:checked')].map(i => i.value).join(','),
    regiao: document.getElementById('fRegiao').value, local: document.getElementById('fLocal').value.trim(),
    email: document.getElementById('soEmail').checked ? '1' : '',
  };
}
function aplicarFiltrosSalvos() {
  let f = {};
  try { f = JSON.parse(localStorage.getItem(CHAVE_FILTROS) || '{}'); } catch (e) { f = {}; }
  document.getElementById('fPais').value = f.pais || '';
  document.getElementById('fIdioma').value = f.idioma || '';
  document.getElementById('fRegiao').value = f.regiao || '';
  document.getElementById('fLocal').value = f.local || '';
  document.getElementById('soEmail').checked = f.email === '1';
  const mods = (f.modalidade || '').split(',');
  document.querySelectorAll('input[name=fMod]').forEach(i => i.checked = mods.includes(i.value));
  let fechado = null;
  try { fechado = localStorage.getItem(CHAVE_FILTROS + '.fechado'); } catch (e) {}
  // No celular o painel começa fechado (ocupa a tela toda); depois vale a sua escolha.
  if (fechado === '1' || (fechado === null && matchMedia('(max-width: 600px)').matches)) alternarFiltros();
}
function consulta() {
  const f = lerFiltros();
  try { localStorage.setItem(CHAVE_FILTROS, JSON.stringify(f)); } catch (e) {}
  document.getElementById('fRegiao').disabled = f.pais === 'exterior';
  return new URLSearchParams(Object.entries(f).filter(([, v]) => v)).toString();
}
async function atualizarTotal(q, meu) {
  try {
    const r = await (await fetch('/api/filtros?' + q)).json();
    if (meu !== carregando) return;  // resposta de um filtro antigo
    document.getElementById('totalFiltro').innerHTML = `<b>${r.total}</b> de ${r.novas} vagas`;
    const local = new URLSearchParams(q).get('local') || '';  // o local DESTA consulta, não o que está no campo agora
    document.getElementById('entendi').textContent = !local ? ''
      : r.lugar ? '📍 Entendi: ' + r.lugar.rotulo : '🔎 Não reconheci o lugar — procurando o texto no anúncio';
    const c = r.contagem;
    const rot = (sel, campo) => document.querySelectorAll(`#${sel} option`).forEach(o => {
      if (!o.value) return;
      o.textContent = o.textContent.replace(/ \(\d+\)$/, '') + ` (${c[campo][o.value] || 0})`;
    });
    rot('fPais', 'pais'); rot('fIdioma', 'idioma'); rot('fRegiao', 'regiao');
  } catch (e) { /* contador é só informativo */ }
}
function alternarFiltros() {
  const p = document.getElementById('filtros'), b = document.getElementById('btnFiltros');
  const fechar = p.style.display !== 'none';
  p.style.display = fechar ? 'none' : '';
  b.setAttribute('aria-expanded', String(!fechar));
  try { localStorage.setItem(CHAVE_FILTROS + '.fechado', fechar ? '1' : '0'); } catch (e) {}
}
function limparFiltros() {
  ['fPais', 'fIdioma', 'fRegiao', 'fLocal'].forEach(id => document.getElementById(id).value = '');
  document.querySelectorAll('#filtros input[type=checkbox]').forEach(i => i.checked = false);
  recarregar();
}
let carregando = 0;
async function carregar() {
  const q = consulta(), meu = ++carregando;
  const ids = new Set(fila.map(v => v.id));
  const novas = await (await fetch('/api/proximas?n=6&' + q)).json();
  if (meu !== carregando) return;  // filtro mudou no meio: descarta resposta velha
  novas.forEach(v => { if (!ids.has(v.id)) fila.push(v); });
  render();
  atualizarTotal(q, meu);
}
function recarregar() { fila = []; carregar(); }
let espera;
document.addEventListener('change', e => { if (e.target.closest('#filtros')) { e.target.blur && e.target.type === 'checkbox' && e.target.blur(); recarregar(); } });
let esperaSug;
async function sugerirLocal(q) {
  const lista = document.getElementById('sugLocal');
  if (q.length < 2) { lista.innerHTML = ''; return; }
  try {
    const sug = await (await fetch('/api/localidades?q=' + encodeURIComponent(q))).json();
    lista.innerHTML = sug.map(s => `<option value="${esc(s.rotulo)}"></option>`).join('');
  } catch (e) { /* sugestão é só ajuda */ }
}
document.addEventListener('input', e => {
  if (e.target.id !== 'fLocal') return;
  carregando++;  // respostas de antes de digitar não valem mais
  document.getElementById('entendi').textContent = '';
  clearTimeout(espera); clearTimeout(esperaSug);
  esperaSug = setTimeout(() => sugerirLocal(e.target.value.trim()), 150);
  espera = setTimeout(recarregar, 400);
});
// Descrições do GitHub vêm em Markdown: mostra como texto limpo.
const limparMarkdown = t => (t || '').replace(/^#{1,6}\s*/gm, '').replace(/\*\*(.*?)\*\*/g, '$1').replace(/^\s*[-*]\s+/gm, '• ').replace(/\[(.*?)\]\((.*?)\)/g, '$1');

function render() {
  const palco = document.getElementById('palco');
  palco.innerHTML = '';
  document.getElementById('acoes').style.visibility = fila.length ? 'visible' : 'hidden';
  document.getElementById('dica').style.visibility = fila.length ? 'visible' : 'hidden';
  if (!fila.length) {
    const comFiltro = Object.values(lerFiltros()).some(Boolean);
    palco.innerHTML = comFiltro
      ? `<div class="card vazio"><h2>Nenhuma vaga com esses filtros</h2><p class="muted">Afrouxe algum filtro ou clique em <b>Limpar</b>. Para achar mais vagas com e-mail, use <b>Procurar e-mails</b>.</p></div>`
      : `<div class="card vazio"><h2>Nada novo por aqui 🎉</h2><p class="muted">Clique em <b>Buscar vagas novas</b> para rodar o radar + GitHub + Remotar.</p></div>`;
    return;
  }
  fila.slice(0, 2).reverse().forEach((v, i, arr) => {
    const el = document.createElement('div');
    el.className = 'card vaga' + (i < arr.length - 1 ? ' atras' : '');
    if (i < arr.length - 1) el.inert = true;  // cartão de trás fora do Tab/leitor de tela
    el.innerHTML = `
      <div class="selo sim">QUERO</div><div class="selo nao">NÃO</div>
      <div class="emp">${esc(v.empresa) || 'Empresa não informada'} ${v.email ? '<span class="email-tag">· ✉ ' + esc(v.email) + '</span>' : ''}</div>
      <h2>${esc(v.titulo)}</h2>
      ${etiquetas({ ...v.classificacao, foco: v.foco })}
      <div class="meta">${[...new Set([v.modalidade, v.local, v.site, v.publicado_em].filter(Boolean))].map(esc).join(' · ')}</div>
      <div class="score"><b style="color:${cor(v.score)}">${v.score}% compatível</b><div class="barra"><i style="width:${v.score}%;background:${cor(v.score)}"></i></div></div>
      <div>${v.em_comum.map(t => `<span class="chip">✓ ${esc(t)}</span>`).join('')}${v.faltando.slice(0, 6).map(t => `<span class="chip miss">${esc(t)}</span>`).join('')}</div>
      <div class="desc">${esc(limparMarkdown(v.descricao)) || '<i>Sem descrição — ao curtir, o sistema baixa a página da vaga.</i>'}</div>
      ${v.link ? `<a href="${esc(v.link)}" target="_blank" rel="noopener" style="margin-top:10px;font-size:13px">Abrir anúncio original ↗</a>` : ''}`;
    if (i === arr.length - 1) arrastavel(el);
    palco.appendChild(el);
  });
}

function etiquetas(c) {
  if (!c) return '';
  const t = [];
  if (c.foco) t.push('⭐ Sua cidade');
  if (c.pais !== 'indefinido') t.push(c.pais === 'brasil' ? '🇧🇷 Brasil' : '🌎 ' + (c.pais_nome || 'Exterior'));
  if (c.uf) t.push((c.cidade ? c.cidade + ' - ' : '') + c.uf + (c.regiao ? ' · ' + c.regiao : ''));
  if (c.modalidade !== 'indefinido') t.push(ROTULO.modalidade[c.modalidade]);
  if (c.idioma !== 'indefinido') t.push('Idioma: ' + ROTULO.idioma[c.idioma]);
  return `<div class="tags">${t.map(x => `<span class="tag">${esc(x)}</span>`).join('')}</div>`;
}

function arrastavel(el) {
  let x0 = null, dx = 0;
  el.addEventListener('pointerdown', e => { if (e.target.closest('a,.desc')) return; x0 = e.clientX; el.setPointerCapture(e.pointerId); el.style.transition = 'none'; });
  el.addEventListener('pointermove', e => {
    if (x0 === null) return; dx = e.clientX - x0;
    el.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`;
    el.querySelector('.selo.sim').style.opacity = Math.max(0, dx / 120);
    el.querySelector('.selo.nao').style.opacity = Math.max(0, -dx / 120);
  });
  el.addEventListener('pointerup', () => {
    if (x0 === null) return; x0 = null; el.style.transition = '';
    if (Math.abs(dx) > 110) decidir(dx > 0 ? 'curtir' : 'descartar');
    else { el.style.transform = ''; el.querySelectorAll('.selo').forEach(s => s.style.opacity = 0); }
    dx = 0;
  });
}

async function decidir(acao) {
  const v = fila[0]; if (!v) return;
  const el = document.querySelector('.vaga:not(.atras)');
  if (el) { el.style.transform = `translateX(${acao === 'curtir' ? 700 : -700}px) rotate(${acao === 'curtir' ? 25 : -25}deg)`; el.style.opacity = 0; }
  fila.shift(); historico.push(v);
  setTimeout(render, 220);
  try {
    await post('/api/decidir/' + v.id, { acao });
    if (acao === 'curtir') toast(v.email ? '♥ Preparando CV + carta — vai para "Prontas"' : '♥ Preparando CV — sem e-mail, vai para "Sem e-mail"');
  } catch (e) { toast('Erro: ' + e.message); }
  if (fila.length < 3) carregar();
}

async function desfazer() {
  const v = historico.pop(); if (!v) return toast('Nada para desfazer');
  await post('/api/decidir/' + v.id, { acao: 'desfazer' });
  fila.unshift(v); render();
}

async function importar() { if (window.estadoAtual.ocupado) return toast('Aguarde a tarefa atual terminar.'); await post('/api/importar'); toast('Buscando vagas… os cartões aparecem ao terminar.', 4000); esperar(); }
async function enriquecer() { if (window.estadoAtual.ocupado) return toast('Aguarde a tarefa atual terminar.'); await post('/api/enriquecer'); toast('Baixando descrições das melhores vagas…', 4000); esperar(); }
function esperar() {
  const t = setInterval(async () => {
    const e = await (await fetch('/api/estado')).json();
    if (!e.ocupado) { clearInterval(t); recarregar(); toast('Pronto!'); }
  }, 2500);
}

document.addEventListener('keydown', e => {
  if (e.target.matches && e.target.matches('input[type=text], input[type=number], input:not([type]), textarea, select')) return;
  if (e.key === 'ArrowRight') decidir('curtir');
  if (e.key === 'ArrowLeft') decidir('descartar');
  if (e.key === 'Backspace') { e.preventDefault(); desfazer(); }
});
aplicarFiltrosSalvos();
carregar();
</script>
{% endblock %}
